# Deepgram dictation hotkeys, from the deepgram-dictate repository (hypr/dictation.conf)
#
#   Right Alt (tap)          start hands-free English dictation; tap again to type it
#   Right Alt (hold)         push-to-talk English: release to type
#   Right Alt + C / M / J    Cantonese / Mandarin / Japanese, hands-free; tap Right Alt to type
#   Esc                      cancel the dictation in progress (Esc still reaches the app)
#
# Hyprland's own PATH lacks ~/.local/bin, hence the full path.
$dictate = $HOME/.local/bin/dictate-key

# On Hyprland 0.52 a Right Alt press matches both "no modifier" and "ALT" binds, and its
# release matches "ALT" only, so one of each is bound (the daemon would also drop a
# duplicate). A modifier's release bind does not fire after a key combination; the daemon
# notices that on its own.
bindd = , Alt_R, Dictation: English (tap = hands-free / hold = push-to-talk), exec, $dictate press
bindrd = ALT, Alt_R, Dictation: Right Alt released, exec, $dictate release

# Right Alt specifically (not Left Alt) + a letter: the `s` flag matches exact keysyms
# (lowercase: what the letter keys produce while Alt is held).
bindsd = Alt_R, c, Dictation: Cantonese, exec, $dictate switch yue
bindsd = Alt_R, m, Dictation: Mandarin, exec, $dictate switch cmn
bindsd = Alt_R, j, Dictation: Japanese, exec, $dictate switch ja

bindnd = , Escape, Dictation: cancel, exec, $dictate cancel
